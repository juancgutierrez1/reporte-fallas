<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Reporte de Fallas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--pri:#0f3d2e;--acc:#1f8a5b;--warn:#c0392b;--bg:#f2f4f3;--card:#fff;--txt:#1b1f1d;--mut:#66706b;--bd:#d9dedb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
#reloj{font-size:13px;opacity:.9;text-align:right;line-height:1.3}
main{padding:12px 12px 120px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.num{background:var(--acc);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;flex:none}
#mapa{height:270px;border-radius:10px;background:#e8ecea}
.gps{font-size:13px;color:var(--mut);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#gpsEstado.bien{color:#0f5132;font-weight:600}
#gpsEstado.regular{color:#8a6500;font-weight:600}
#gpsEstado.mal{color:var(--warn);font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--txt);font-family:inherit}
textarea{min-height:80px;resize:vertical}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}
.chip{padding:12px 8px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;font-size:14px;text-align:center;cursor:pointer;color:var(--txt);font-family:inherit}
.chip.on{border-color:var(--acc);background:#e6f4ec;font-weight:700}
.sino{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sino .chip.on[data-v="SÍ"]{border-color:var(--warn);background:#fbe9e7}
.btn{display:block;width:100%;padding:16px;font-size:17px;font-weight:700;border:0;border-radius:12px;cursor:pointer;font-family:inherit}
.btn-pri{background:var(--acc);color:#fff}
.btn-wa{background:#25d366;color:#fff}
.btn-sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn:disabled{opacity:.6}
.btn-mini{padding:8px 10px;font-size:13px;border-radius:8px;border:1px solid var(--bd);background:#fff;white-space:nowrap;cursor:pointer;color:var(--txt)}
#pie{position:fixed;left:0;right:0;bottom:0;padding:14px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(242,244,243,0),var(--bg) 35%);z-index:1000}
#pie .btn{max-width:640px;margin:0 auto}
#preview{max-width:100%;max-height:260px;border-radius:10px;margin-top:8px;display:none}
.aviso{padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px;display:none}
.aviso.err{background:#fbe9e7;color:#8e1f14;display:block}
.aviso.ok{background:#e6f4ec;color:#0f5132;display:block}
.aviso.info{background:#fff4d6;color:#6b4e00;display:block}
#exito{display:none}
#exito h2{font-size:18px;margin:0 0 4px;text-align:center}
#exitoSub{text-align:center;color:var(--mut);font-size:14px;margin:0}
.id{font-size:20px;font-weight:800;color:var(--pri);text-align:center;margin:10px 0 12px;letter-spacing:.5px;word-break:break-all}
.resumen{font-size:15px}
.resumen div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eef0ef;padding:6px 0}
.resumen span:first-child{color:var(--mut)}
.resumen span:last-child{text-align:right;word-break:break-word}
.pila>*+*{margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>Reporte de Fallas</h1>
  <div id="reloj"></div>
</header>

<main>
  <div id="cola" class="aviso"></div>

  <!-- ===================== FORMULARIO ===================== -->
  <div id="formulario">
    <div id="msg" class="aviso"></div>

    <section class="card">
      <h2><span class="num">1</span> Ubicación de la falla</h2>
      <div id="mapa"></div>
      <div class="gps">
        <span id="gpsEstado">Buscando señal GPS…</span>
        <button type="button" class="btn-mini" id="btnGps">📍 Usar mi GPS</button>
      </div>
      <div class="gps"><span>Si el punto no es exacto, toque el mapa o arrastre el marcador.</span></div>
    </section>

    <section class="card">
      <h2><span class="num">2</span> Vehículo y operador</h2>
      <div class="fila">
        <div><label for="vehiculo">Vehículo *</label><input id="vehiculo" list="lstVehiculos" autocomplete="off" placeholder="Número interno"></div>
        <div><label for="ruta">Ruta *</label><input id="ruta" list="lstRutas" autocomplete="off" placeholder="Ruta"></div>
      </div>
      <div class="fila">
        <div><label for="operador">Nombre</label><input id="operador" autocomplete="name" placeholder="Operador"></div>
        <div><label for="celular">Celular *</label><input id="celular" type="tel" inputmode="numeric" maxlength="10" placeholder="3001234567"></div>
      </div>
      <datalist id="lstVehiculos"></datalist>
      <datalist id="lstRutas"></datalist>
    </section>

    <section class="card">
      <h2><span class="num">3</span> ¿Qué falla presenta? *</h2>
      <div class="chips" id="fallas"></div>
      <label>¿El vehículo quedó detenido? *</label>
      <div class="sino" id="detenido">
        <button type="button" class="chip" data-v="SÍ">Sí, detenido</button>
        <button type="button" class="chip" data-v="NO">No, sigue operando</button>
      </div>
    </section>

    <section class="card">
      <h2><span class="num">4</span> Detalle</h2>
      <label for="descripcion">Describa la falla</label>
      <textarea id="descripcion" maxlength="1000" placeholder="Qué pasó, ruidos, testigos encendidos en el tablero, etc."></textarea>
      <label for="foto">Foto (opcional)</label>
      <input id="foto" type="file" accept="image/*">
      <img id="preview" alt="Vista previa de la foto">
    </section>
  </div>

  <!-- ===================== CONFIRMACIÓN ===================== -->
  <section id="exito" class="card">
    <h2 id="exitoTitulo"></h2>
    <p id="exitoSub"></p>
    <div class="id" id="exitoId"></div>
    <div class="resumen" id="resumen"></div>
    <div class="pila" style="margin-top:16px">
      <button class="btn btn-wa" id="btnWa">Enviar por WhatsApp</button>
      <button class="btn btn-sec" id="btnNuevo">Hacer otro reporte</button>
    </div>
  </section>
</main>

<div id="pie"><button class="btn btn-pri" id="btnEnviar">Enviar reporte</button></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
/* =====================================================================
   CONFIGURACIÓN — solo hay que tocar este bloque
   ===================================================================== */
const CONFIG = {
  // URL del Apps Script (Implementar > Aplicación web). Termina en /exec
  API_URL: 'https://script.google.com/macros/s/AKfycbxiytKdDt1UGP5Jl5lg87gb9p9DqtZdVnNlwN62NJUpJ_wReFOKJNTppgaKRZvzZ5EEPA/exec',
  // Número que recibe los reportes (con indicativo, sin +). Ej: '573001234567'
  // Vacío = WhatsApp le deja al operador escoger el chat o grupo.
  WHATSAPP_NUMERO: '573045749289',
  // Centro inicial del mapa mientras llega el GPS (Cartagena)
  MAPA_CENTRO: [10.3910, -75.4794]
};

const FALLAS_DEFECTO = [
  'Motor', 'Frenos', 'Eléctrico / batería', 'Llantas', 'Aire acondicionado',
  'Puertas', 'Suspensión', 'Dirección', 'Caja / embrague',
  'Fuga (aceite, agua, aire)', 'Recalentamiento', 'Carrocería / vidrios',
  'Accidente / choque', 'Otro'
];

/* ===================================================================== */
const $ = id => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const estado = { falla: null, detenido: null, pos: null, gps: null, manual: false, foto: null };
let mapa = null, marcador = null, circulo = null, watchId = null, centrado = false, enviandoCola = false;

const pad = n => String(n).padStart(2, '0');
const fechaLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const horaLocal = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const apiOk = () => /^https:\/\/script\.google(usercontent)?\.com\//.test(CONFIG.API_URL);

function mostrar(texto, tipo) {
  const el = $('msg'); el.className = 'aviso ' + tipo; el.textContent = texto;
}
function limpiarMsg() { $('msg').className = 'aviso'; $('msg').textContent = ''; }

/* ---------- Reloj ---------- */
function tic() { const d = new Date(); $('reloj').innerHTML = fechaLocal(d) + '<br>' + horaLocal(d); }
setInterval(tic, 1000); tic();

/* ---------- Mapa ---------- */
function iniciarMapa() {
  if (typeof L === 'undefined') {
    $('mapa').style.display = 'none';
    $('gpsEstado').textContent = 'Mapa no disponible (sin internet). Se usará solo el GPS.';
    return;
  }
  mapa = L.map('mapa').setView(CONFIG.MAPA_CENTRO, 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(mapa);
  marcador = L.marker(CONFIG.MAPA_CENTRO, { draggable: true });
  marcador.on('dragend', () => fijarManual(marcador.getLatLng()));
  mapa.on('click', e => fijarManual(e.latlng));
}
function colocar(lat, lng) {
  if (!mapa) return;
  if (!mapa.hasLayer(marcador)) marcador.addTo(mapa);
  marcador.setLatLng([lat, lng]);
}
function fijarManual(ll) {
  estado.manual = true;
  estado.pos = { lat: ll.lat, lng: ll.lng };
  colocar(ll.lat, ll.lng);
  if (circulo) { mapa.removeLayer(circulo); circulo = null; }
  pintarGps();
}

/* ---------- GPS ---------- */
function iniciarGps() {
  if (!('geolocation' in navigator)) {
    $('gpsEstado').textContent = 'Este navegador no da GPS. Marque el punto en el mapa.';
    $('gpsEstado').className = 'mal';
    return;
  }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  estado.manual = false; centrado = false;
  $('gpsEstado').textContent = 'Buscando señal GPS…'; $('gpsEstado').className = '';
  watchId = navigator.geolocation.watchPosition(onPos, onErr,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function onPos(p) {
  const c = p.coords;
  estado.gps = {
    lat: c.latitude, lng: c.longitude, alt: c.altitude, precision: c.accuracy,
    precisionAlt: c.altitudeAccuracy, velocidad: c.speed, rumbo: c.heading
  };
  if (!estado.manual) {
    estado.pos = { lat: c.latitude, lng: c.longitude };
    colocar(c.latitude, c.longitude);
    if (mapa) {
      if (!circulo) circulo = L.circle([c.latitude, c.longitude], { radius: c.accuracy, weight: 1, fillOpacity: .12 }).addTo(mapa);
      else circulo.setLatLng([c.latitude, c.longitude]).setRadius(c.accuracy);
      if (!centrado) { mapa.setView([c.latitude, c.longitude], 17); centrado = true; }
    }
  }
  pintarGps();
}
function onErr(err) {
  const el = $('gpsEstado'); el.className = 'mal';
  if (err.code === 1) el.textContent = 'Permiso de ubicación negado. Actívelo en el navegador o marque el punto en el mapa.';
  else el.textContent = 'Sin señal GPS. Marque el punto tocando el mapa.';
}
function pintarGps() {
  const el = $('gpsEstado');
  if (estado.manual && estado.pos) {
    el.className = 'regular';
    el.textContent = `Punto marcado a mano (${estado.pos.lat.toFixed(5)}, ${estado.pos.lng.toFixed(5)})`;
  } else if (estado.gps) {
    const a = Math.round(estado.gps.precision);
    el.className = a <= 20 ? 'bien' : a <= 60 ? 'regular' : 'mal';
    el.textContent = `GPS listo · precisión ±${a} m` + (estado.gps.alt != null ? ` · alt ${Math.round(estado.gps.alt)} m` : '');
  }
}
$('btnGps').addEventListener('click', iniciarGps);

/* ---------- Listas (vehículos, rutas, fallas) ---------- */
function pintarListas(l) {
  const opciones = arr => arr.map(v => { const o = document.createElement('option'); o.value = v; return o; });
  $('lstVehiculos').replaceChildren(...opciones(l.vehiculos || []));
  $('lstRutas').replaceChildren(...opciones(l.rutas || []));
  const cont = $('fallas');
  cont.replaceChildren(...(l.fallas && l.fallas.length ? l.fallas : FALLAS_DEFECTO).map(f => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (estado.falla === f ? ' on' : ''); b.textContent = f; b.dataset.v = f;
    return b;
  }));
}
async function cargarListas() {
  pintarListas(LS.get('listas', { vehiculos: [], rutas: [], fallas: FALLAS_DEFECTO }));
  if (!apiOk()) return;
  try {
    const r = await fetch(CONFIG.API_URL + '?accion=listas');
    const j = await r.json();
    if (j.ok) {
      const l = { vehiculos: j.vehiculos || [], rutas: j.rutas || [], fallas: (j.fallas && j.fallas.length) ? j.fallas : FALLAS_DEFECTO };
      LS.set('listas', l); pintarListas(l);
    }
  } catch (e) { /* sin señal: se usan las listas guardadas */ }
}
$('fallas').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  estado.falla = b.dataset.v;
  [...$('fallas').children].forEach(x => x.classList.toggle('on', x === b));
});
$('detenido').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  estado.detenido = b.dataset.v;
  [...$('detenido').children].forEach(x => x.classList.toggle('on', x === b));
});
$('celular').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10); });

/* ---------- Foto (se comprime en el teléfono) ---------- */
function comprimir(file, max, calidad) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', calidad));
    };
    img.onerror = rej; img.src = url;
  });
}
$('foto').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) { estado.foto = null; $('preview').style.display = 'none'; return; }
  try {
    estado.foto = await comprimir(f, 1280, 0.7);
    $('preview').src = estado.foto; $('preview').style.display = 'block';
  } catch (err) { estado.foto = null; mostrar('No se pudo procesar la foto. Puede enviar el reporte sin ella.', 'err'); }
});

/* ---------- Envío ---------- */
function generarId() {
  const d = new Date(), r = Math.random().toString(36).slice(2, 6).toUpperCase();
  return `F-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${r}`;
}
const num = (v, dec) => (v == null || isNaN(v)) ? null : +Number(v).toFixed(dec);

async function subir(rep) {
  if (!apiOk()) return { ok: false, error: 'API no configurada' };
  try {
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 30000);
    // Sin cabeceras personalizadas (text/plain) para evitar el bloqueo CORS de Apps Script
    const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(rep), signal: ctrl.signal });
    clearTimeout(t);
    return await r.json();
  } catch (e) { return { ok: false, error: String(e) }; }
}

async function enviar() {
  limpiarMsg();
  const v = $('vehiculo').value.trim(), ruta = $('ruta').value.trim(),
        cel = $('celular').value.replace(/\D/g, ''), op = $('operador').value.trim(),
        desc = $('descripcion').value.trim();
  const faltan = [];
  if (!estado.pos) faltan.push('la ubicación (espere el GPS o toque el mapa)');
  if (!v) faltan.push('el vehículo');
  if (!ruta) faltan.push('la ruta');
  if (cel.length !== 10) faltan.push('un celular de 10 dígitos');
  if (!estado.falla) faltan.push('el tipo de falla');
  if (!estado.detenido) faltan.push('si el vehículo quedó detenido');
  if (estado.falla === 'Otro' && !desc) faltan.push('la descripción (eligió "Otro")');
  if (faltan.length) { mostrar('Falta: ' + faltan.join(', ') + '.', 'err'); scrollTo({ top: 0, behavior: 'smooth' }); return; }

  LS.set('operador', { vehiculo: v, ruta, celular: cel, operador: op });
  const d = new Date(), g = estado.gps || {};
  const rep = {
    id: generarId(), fechaHoraISO: d.toISOString(), fecha: fechaLocal(d), hora: horaLocal(d),
    vehiculo: v, ruta, operador: op, celular: cel,
    falla: estado.falla, detenido: estado.detenido, descripcion: desc,
    lat: num(estado.pos.lat, 7), lng: num(estado.pos.lng, 7),
    altitud: num(g.alt, 1), precision: num(g.precision, 1), precisionAltitud: num(g.precisionAlt, 1),
    velocidad: num(g.velocidad, 2), rumbo: num(g.rumbo, 1),
    manual: estado.manual, latGps: num(g.lat, 7), lngGps: num(g.lng, 7),
    foto: estado.foto, dispositivo: navigator.userAgent.slice(0, 200)
  };

  const btn = $('btnEnviar'); btn.disabled = true; btn.textContent = 'Enviando…';
  const r = await subir(rep);
  btn.disabled = false; btn.textContent = 'Enviar reporte';
  if (r.ok) { rep.fotoUrl = r.foto || ''; mostrarExito(rep, true); }
  else { encolar(rep); mostrarExito(rep, false); }
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
}
$('btnEnviar').addEventListener('click', enviar);

/* ---------- Cola sin señal ---------- */
function encolar(rep) {
  const c = LS.get('cola', []); c.push(rep);
  if (!LS.set('cola', c)) { rep.foto = null; c[c.length - 1] = rep; LS.set('cola', c); }
  pintarCola();
}
async function procesarCola() {
  if (enviandoCola) return;
  const c = LS.get('cola', []);
  if (!c.length || !navigator.onLine || !apiOk()) { pintarCola(); return; }
  enviandoCola = true;
  const pendientes = [];
  for (const rep of c) { const r = await subir(rep); if (!r.ok) pendientes.push(rep); }
  LS.set('cola', pendientes); enviandoCola = false; pintarCola();
}
function pintarCola() {
  const n = LS.get('cola', []).length, el = $('cola');
  if (n) { el.className = 'aviso info'; el.textContent = `${n} reporte(s) guardado(s) en este teléfono. Se enviarán solos cuando haya señal.`; }
  else { el.className = 'aviso'; el.textContent = ''; }
}
addEventListener('online', procesarCola);
setInterval(procesarCola, 60000);

/* ---------- WhatsApp ---------- */
function textoWhatsApp(r) {
  const maps = `https://maps.google.com/?q=${r.lat},${r.lng}`;
  return [
    `*REPORTE DE FALLA* ${r.id}`,
    `Vehículo: *${r.vehiculo}*`,
    `Ruta: ${r.ruta}`,
    `Falla: *${r.falla}*`,
    `Vehículo detenido: *${r.detenido}*`,
    r.descripcion ? `Detalle: ${r.descripcion}` : null,
    `Fecha: ${r.fecha}  Hora: ${r.hora}`,
    `Ubicación: ${maps}`,
    `Coordenadas: ${r.lat}, ${r.lng}` + (r.altitud != null ? ` | Altitud: ${Math.round(r.altitud)} m` : ''),
    r.manual ? 'Punto marcado manualmente en el mapa' : (r.precision != null ? `Precisión GPS: ±${Math.round(r.precision)} m` : null),
    `Operador: ${r.operador || '-'} | Cel: ${r.celular}`,
    r.fotoUrl ? `Foto: ${r.fotoUrl}` : null
  ].filter(Boolean).join('\n');
}
function abrirWhatsApp(r) {
  const t = encodeURIComponent(textoWhatsApp(r));
  const n = String(CONFIG.WHATSAPP_NUMERO || '').replace(/\D/g, '');
  location.href = n ? `https://wa.me/${n}?text=${t}` : `https://wa.me/?text=${t}`;
}

/* ---------- Pantalla de confirmación ---------- */
function mostrarExito(r, enServidor) {
  $('formulario').style.display = 'none'; $('pie').style.display = 'none'; $('exito').style.display = 'block';
  $('exitoTitulo').textContent = enServidor ? '✅ Reporte guardado' : '📶 Guardado en el teléfono';
  $('exitoSub').textContent = enServidor ? 'Ya quedó en la base de datos.' : 'No hay señal: se enviará solo cuando vuelva. Igual puede mandarlo por WhatsApp.';
  $('exitoId').textContent = r.id;
  const filas = [
    ['Vehículo', r.vehiculo], ['Ruta', r.ruta], ['Falla', r.falla], ['Detenido', r.detenido],
    ['Fecha / hora', `${r.fecha} ${r.hora}`], ['Coordenadas', `${r.lat}, ${r.lng}`],
    ['Altitud', r.altitud != null ? `${Math.round(r.altitud)} m` : 'No disponible'],
    ['Foto', r.foto ? 'Sí' : 'No']
  ];
  $('resumen').replaceChildren(...filas.map(([k, v]) => {
    const div = document.createElement('div'), a = document.createElement('span'), b = document.createElement('span');
    a.textContent = k; b.textContent = v; div.append(a, b); return div;
  }));
  $('btnWa').onclick = () => abrirWhatsApp(r);
  scrollTo(0, 0); pintarCola();
}
$('btnNuevo').addEventListener('click', () => {
  estado.falla = null; estado.detenido = null; estado.foto = null;
  document.querySelectorAll('.chip.on').forEach(x => x.classList.remove('on'));
  $('descripcion').value = ''; $('foto').value = ''; $('preview').style.display = 'none';
  $('exito').style.display = 'none'; $('formulario').style.display = 'block'; $('pie').style.display = 'block';
  limpiarMsg(); iniciarGps(); scrollTo(0, 0);
});

/* ---------- Inicio ---------- */
(function iniciar() {
  const o = LS.get('operador', {});
  $('vehiculo').value = o.vehiculo || ''; $('ruta').value = o.ruta || '';
  $('celular').value = o.celular || ''; $('operador').value = o.operador || '';
  iniciarMapa(); iniciarGps(); cargarListas(); procesarCola();
  if (!apiOk()) mostrar('Modo prueba: falta configurar API_URL. Los reportes quedan guardados en este teléfono.', 'info');
})();
</script>
